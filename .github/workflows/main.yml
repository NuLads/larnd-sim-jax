# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run, will cancel older workflows if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main, ci ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
env:
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  VECLIB_MAXIMUM_THREADS: 1
  NUMEXPR_NUM_THREADS: 1
  XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1"

jobs:
  test-sim:
    # Steps represent a sequence of tasks that will be executed as part of the job
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          uv pip install --system .[dev] pytest-xdist  # parallelize tests

      - name: Check simulation
        run: |
          ./optimize/simulate_test.sh

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: simulation-plots-${{ github.sha }}
          path: output/*.png

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: simulation-plots-${{ github.event.pull_request.head.sha }}
          path: output/*.png


  test-fit:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          uv pip install --system .[dev] pytest-xdist  # parallelize tests
      - name: Check fit
        run: |
          ./optimize/fit_test.sh

      - name: Make fit plots
        run: |
          for f in fit_result/*/*.pkl; do
            ./optimize/analysis_scripts/plot_fit.py --input_file "$f" --output_dir output
          done

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: fit-plots-${{ github.sha }}
          path: output/*.png

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: fit-plots-${{ github.event.pull_request.head.sha }}
          path: output/*.png

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: fit-result
          path: fit_result/**/*.pkl
          if-no-files-found: error
      
      - name: Validate fit convergence
        run: |
          for f in fit_result/*/*.pkl; do
            python3 tests/test_fit_convergence.py --input_file "$f" --strict
          done

